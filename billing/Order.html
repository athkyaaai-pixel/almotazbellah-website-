<!doctype html>
<html lang="ar" dir="rtl"><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#f5f6f8;color:#0a1931;font:16px/1.65 Arial,sans-serif}main{max-width:34rem;margin:2rem auto;background:white;border-radius:16px;padding:clamp(1rem,5vw,2rem);box-shadow:0 8px 30px #0a19311a}
h1{font-size:1.65rem;margin:0 0 .5rem}p{margin:.5rem 0 1rem}label{display:block;margin-top:.9rem;font-weight:bold}input{box-sizing:border-box;width:100%;margin-top:.25rem;padding:.7rem;border:1px solid #aab3c3;border-radius:6px;font:inherit}
button,a{font:inherit}button{margin-top:1.15rem;background:#0a1931;color:white;border:0;padding:.7rem 1.25rem;border-radius:8px;font-weight:bold;cursor:pointer}button:disabled{opacity:.65}
#message{margin-top:1rem}a{color:#175289}.summary{padding:.8rem;background:#f3f5f8;border-inline-start:3px solid #c8a96e}
</style></head><body><main>
<h1><?= plan[0] ?></h1><p><?= plan[3] ?></p>
<div class="summary"><strong><?= plan[4] ?></strong><br>المبلغ المطلوب الآن <?= plan[1] ?> ريال
<? if (plan[2] > 1) { ?><br>إجمالي مدة الاشتراك <?= plan[1]*plan[2] ?> ريال<br>يبدأ الاشتراك بعد تأكيد السداد واستكمال الاتفاق السنوي.<? } ?>
</div>
<form id="order">
<label>اسم الجمعية الرسمي<input required name="association" minlength="2" maxlength="160" autocomplete="organization"></label>
<label>العنوان<input required name="address" minlength="3" maxlength="250" autocomplete="street-address"></label>
<label>البريد الإلكتروني<input required name="email" type="email" maxlength="150" dir="ltr" autocomplete="email"></label>
<label>رقم الجوال<input required name="phone" type="tel" maxlength="20" dir="ltr" autocomplete="tel"></label>
<p>تُستخدم بيانات التواصل لإصدار الفاتورة ومتابعة طلب الخدمة.</p>
<button type="submit">إصدار الفاتورة</button>
</form>
<p id="message" role="status"></p>
<a id="download" hidden>تحميل الفاتورة (PDF)</a>
</main><script>
const planId = <?= planId ?>;
const requestId = crypto.randomUUID();
const form = document.querySelector('#order');
const button = form.querySelector('button');
const message = document.querySelector('#message');
const download = document.querySelector('#download');
form.addEventListener('submit', event => {
  event.preventDefault();
  button.disabled = true;
  message.textContent = 'جارٍ إصدار الفاتورة…';
  const data = Object.fromEntries(new FormData(form));
  google.script.run.withSuccessHandler(result => {
    const bytes = Uint8Array.from(atob(result.pdf), character => character.charCodeAt(0));
    download.href = URL.createObjectURL(new Blob([bytes], {type:'application/pdf'}));
    download.download = result.id + '.pdf';
    download.hidden = false;
    message.textContent = result.emailSent ? 'صدرت الفاتورة وأُرسلت إلى بريد الجمعية.' : 'صدرت الفاتورة. تعذّر إرسال البريد ويمكنك تحميلها هنا.';
    form.hidden = true;
  }).withFailureHandler(error => {
    message.textContent = error.message?.includes('Exception:') ? 'تعذّر إصدار الفاتورة الآن. حاول مرة أخرى.' : error.message || 'تعذّر إصدار الفاتورة الآن.';
    button.disabled = false;
  }).issueInvoice({...data,planId,requestId});
});
</script></body></html>
